name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/FaceMosaicSharp.csproj

      - name: Publish (runtime-dependent)
        run: dotnet publish src/FaceMosaicSharp.csproj -c Release -o publish/runtime-dependent --self-contained false

      - name: Publish (self-contained)
        run: dotnet publish src/FaceMosaicSharp.csproj -c Release -o publish/self-contained --runtime win-x64 --self-contained true

      - name: Package
        run: |
          Compress-Archive -Path publish/runtime-dependent/* -DestinationPath FaceMosaicSharp-${{ github.ref_name }}.zip
          Compress-Archive -Path publish/self-contained/* -DestinationPath FaceMosaicSharp-${{ github.ref_name }}-self-contained.zip

      - name: Upload artifact (runtime-dependent)
        uses: actions/upload-artifact@v4
        with:
          name: FaceMosaicSharp-runtime-dependent
          path: publish/runtime-dependent/

      - name: Upload artifact (self-contained)
        uses: actions/upload-artifact@v4
        with:
          name: FaceMosaicSharp-self-contained
          path: publish/self-contained/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: FaceMosaicSharp-*.zip
          name: FaceMosaicSharp ${{ github.ref_name }}
          body: |
            ## 下载说明
            - `FaceMosaicSharp-版本.zip`：需要 .NET 10 运行时（体积小）
            - `FaceMosaicSharp-版本-self-contained.zip`：独立包，无需安装运行时（即开即用）
