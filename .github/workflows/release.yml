name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/FaceMosaicSharp.csproj

      - name: Publish
        run: dotnet publish src/FaceMosaicSharp.csproj -c Release -o publish --self-contained false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceMosaicSharp
          path: publish/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/
          name: FaceMosaicSharp ${{ github.ref_name }}
          body: |
            ## 更新内容
            - 请在此填写发布说明
